schema_version: "3.0"
expand_active_specialist_examples: true
cases:
  - id: xhs-zero-to-one-not-startup
    input: 帮我做一个小红书账号从0到1运营方案
    expected_agents: [marketing-xiaohongshu-operator]
    forbidden_agents: [core-orchestrator, strategy-opc]
    direction_gate_required: false
  - id: xhs-note-content
    input: 为护肤品写三篇小红书种草笔记
    expected_agents: [marketing-xiaohongshu-specialist]
    forbidden_agents: [marketing-xiaohongshu-operator]
    direction_gate_required: false
  - id: douyin-account
    input: 规划抖音账号矩阵和DOU+投放
    expected_agents: [marketing-douyin-strategist]
    forbidden_agents: [marketing-video-editing-coach]
    direction_gate_required: false
  - id: video-editing
    input: 教我用剪映完成短视频剪辑和调色
    expected_agents: [marketing-video-editing-coach]
    forbidden_agents: [marketing-douyin-strategist]
    direction_gate_required: false
  - id: private-domain
    input: 规划企业微信私域和SCRM复购运营
