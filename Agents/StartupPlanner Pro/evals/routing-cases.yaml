    input: 制定LinkedIn企业号和创始人IP策略
    expected_agents: [marketing-social-strategist]
    forbidden_agents: []
    direction_gate_required: false
  - id: release-readiness
    input: 评审产品是否达到发布就绪并规划规模化治理
    expected_agents: [product-director]
